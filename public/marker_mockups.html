<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #e5e7eb; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'Pretendard', sans-serif; }
    .tail { position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%) rotate(45deg); width: 14px; height: 14px; background-color: white; z-index: -1; box-shadow: 2px 2px 4px rgba(0,0,0,0.1); }
  </style>
</head>
<body>

  <div class="mb-10 text-center">
    <h1 class="text-2xl font-bold text-gray-800 mb-2">Food-First 썸네일 마커 제안 (3가지 폼팩터)</h1>
    <p class="text-gray-500">유튜버 얼굴 대신 <b>'음식 사진'</b>을 메인으로, 유튜버는 <b>'마이크로 뱃지'</b>로 보여줍니다.</p>
  </div>

  <div class="flex items-end justify-center gap-16 mt-8">
    
    <!-- 1. 일반 가로형 -->
    <div class="flex flex-col items-center">
      <div class="relative flex flex-col items-center mb-6">
        <div class="relative w-[130px] h-[80px] bg-white rounded-[14px] shadow-[0_8px_30px_rgb(0,0,0,0.12)] border-[3.5px] border-white z-10 overflow-hidden">
          <img src="https://images.unsplash.com/photo-1544025162-8311cb1e6a18?w=300&h=200&fit=crop" class="w-full h-full object-cover" alt="food">
        </div>
        <!-- 마이크로 유튜버 뱃지 -->
        <div class="absolute -bottom-3 -right-3 w-11 h-11 rounded-full border-[3px] border-white shadow-md bg-white z-20 overflow-hidden">
          <img src="https://images.unsplash.com/photo-1599566150163-29194dcaad36?w=100&h=100&fit=crop" class="w-full h-full object-cover" alt="youtuber">
        </div>
        <div class="tail"></div>
      </div>
      <div class="text-center">
        <div class="font-bold text-gray-800">1. 일반 영상 (가로형)</div>
        <div class="text-[13px] font-medium text-gray-500 mt-1">16:9 비율 썸네일 + 뱃지</div>
      </div>
    </div>

    <!-- 2. 쇼츠 세로형 -->
    <div class="flex flex-col items-center">
      <div class="relative flex flex-col items-center mb-6">
        <div class="relative w-[85px] h-[130px] bg-white rounded-[14px] shadow-[0_8px_30px_rgb(0,0,0,0.12)] border-[3.5px] border-white z-10 overflow-hidden">
          <img src="https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=200&h=350&fit=crop" class="w-full h-full object-cover" alt="sushi">
          <div class="absolute top-1.5 left-1.5 bg-black/70 backdrop-blur-sm text-white text-[9px] font-black px-1.5 py-0.5 rounded flex items-center gap-1">
            <svg width="8" height="8" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> SHORTS
          </div>
        </div>
        <!-- 마이크로 유튜버 뱃지 -->
        <div class="absolute -bottom-3 -right-4 w-11 h-11 rounded-full border-[3px] border-white shadow-md bg-white z-20 overflow-hidden">
          <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&h=100&fit=crop" class="w-full h-full object-cover" alt="youtuber">
        </div>
        <div class="tail"></div>
      </div>
      <div class="text-center">
        <div class="font-bold text-gray-800">2. 쇼츠 영상 (세로형)</div>
        <div class="text-[13px] font-medium text-gray-500 mt-1">9:16 숏폼 최적화 폼팩터</div>
      </div>
    </div>

    <!-- 3. 프리미엄 정보 결합형 -->
    <div class="flex flex-col items-center">
      <div class="relative flex flex-col items-center mb-6">
        <!-- 조회수 알림 뱃지 -->
        <div class="absolute -top-[12px] z-30 bg-gradient-to-r from-red-500 to-orange-500 text-white text-[10px] font-black px-2.5 py-0.5 rounded-full border-[1.5px] border-white shadow-sm tracking-tighter">
          🔥 245만뷰
        </div>
        <div class="relative w-[130px] h-[80px] bg-white rounded-[14px] shadow-[0_8px_30px_rgb(0,0,0,0.12)] border-[3.5px] border-white z-10 overflow-hidden">
          <img src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=300&h=200&fit=crop" class="w-full h-full object-cover" alt="pasta">
          <!-- 레스토랑 이름 레이블 -->
          <div class="absolute bottom-1.5 left-1.5 bg-black/60 backdrop-blur-sm text-white text-[11px] font-bold px-2 py-0.5 rounded shadow-sm">
            몽탄
          </div>
        </div>
        <!-- 마이크로 유튜버 뱃지 -->
        <div class="absolute -bottom-3 -right-3 w-11 h-11 rounded-full border-[3px] border-white shadow-md bg-white z-20 overflow-hidden">
          <img src="https://images.unsplash.com/photo-1580489944761-15a19d654956?w=100&h=100&fit=crop" class="w-full h-full object-cover" alt="youtuber">
        </div>
        <div class="tail"></div>
      </div>
      <div class="text-center">
        <div class="font-bold text-gray-800">3. 메가 핫플 (종합형)</div>
        <div class="text-[13px] font-medium text-gray-500 mt-1">조회수 뱃지 + 식당명 표시</div>
      </div>
    </div>

  </div>

</body>
</html>
